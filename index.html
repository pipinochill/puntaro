<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Puntaro</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2C4536">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Puntaro"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/tile-180.png"><link rel="icon" href="icons/tile-192.png">
<style>html,body{margin:0;background:#1B1C1A}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}</style></head>
<body><div id="root"></div><script src="app.js"></script>
<script>if("serviceWorker"in navigator){const had=!!navigator.serviceWorker.controller;let done=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!had||done)return;const c=navigator.serviceWorker.controller,ch=new MessageChannel();ch.port1.onmessage=e=>{if(!done&&window.PUNTARO_VERSION&&e.data!=="puntaro-"+window.PUNTARO_VERSION){done=true;location.reload()}};c&&c.postMessage("version",[ch.port2])});addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{}))}</script></body></html>
